# Builds site/ and publishes it to GitHub Pages.
#
# Pages' "deploy from a branch" mode can only serve the repo root or /docs, and
# it serves files verbatim — it cannot run a build. A Vite app has to be compiled
# first, so this builds on Actions and uploads the result. That also keeps the
# built output out of the repository.
#
# Requires Settings -> Pages -> Source: "GitHub Actions".
name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:        # lets you redeploy without a commit

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it, but never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
